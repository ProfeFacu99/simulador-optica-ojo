<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador: Generador Eléctrico (Inducción de Faraday)</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0066cc;
            --border-color: #dddddd;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Top Section: Controls + 3D View */
        #top-section {
            display: flex;
            flex: 1;
            height: calc(100vh - 180px);
        }

        /* Panel de Control */
        #controls-panel {
            width: 320px;
            min-width: 250px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 10;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 5px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
            line-height: 1.2;
        }

        .val-display {
            font-weight: normal;
            color: var(--accent-color);
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .checkbox-group {
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-group input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            margin-top: 2px;
        }

        .checkbox-group label {
            cursor: pointer;
            font-size: 0.85rem;
            line-height: 1.3;
            font-weight: normal;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 4px;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #005bb5;
        }
        
        button.btn-secondary {
            background-color: #6c757d;
        }
        button.btn-secondary:hover {
            background-color: #5a6268;
        }

        /* Vista 3D */
        #view-3d-container {
            flex: 1;
            position: relative;
            background-color: #ffffff;
            cursor: default;
        }

        /* Contador de líneas (Flotante) */
        #lines-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 170, 255, 0.15);
            border: 2px solid #00aaff;
            color: #005bb5;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            display: block; /* Activado por defecto */
            z-index: 20;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #lines-val {
            font-size: 1.3rem;
            color: #004488;
        }

        /* Osciloscopio */
        #oscilloscope-container {
            height: 180px;
            background-color: #111;
            border-top: 2px solid #444;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #oscilloscope-header {
            background-color: #222;
            color: #ddd;
            font-size: 0.85rem;
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }

        #volt-display-container {
            color: #00ff00;
            font-weight: bold;
            background-color: #000;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #005500;
            display: flex;
            align-items: center;
        }
        
        #volt-val {
            display: inline-block;
            width: 55px;
            text-align: right;
            margin-right: 4px;
        }

        #osc-canvas {
            width: 100%;
            flex: 1;
            display: block;
        }

        @media (max-width: 768px) {
            #top-section {
                flex-direction: column;
            }
            #controls-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 250px;
            }
            #lines-counter {
                top: 10px;
                right: 10px;
                font-size: 0.85rem;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="app-container">
    <div id="top-section">
        <div id="controls-panel">
            <h2>Generador Eléctrico</h2>
            
            <div class="control-group">
                <label for="rpm-slider">Velocidad de giro (esfuerzo): <br><span class="val-display" id="rpm-val">0</span> RPM</label>
                <input type="range" id="rpm-slider" min="0" max="120" step="5" value="0">
            </div>

            <div class="control-group">
                <label for="turns-slider">Vueltas de la bobina (espiras): <span class="val-display" id="turns-val">2</span></label>
                <input type="range" id="turns-slider" min="1" max="5" step="1" value="2">
            </div>

            <div class="control-group">
                <label for="size-slider">Tamaño de la bobina: <span class="val-display" id="size-val">100</span>%</label>
                <input type="range" id="size-slider" min="50" max="150" step="10" value="100">
            </div>

            <div class="control-group">
                <label for="field-slider">Intensidad del campo magnético: <br><span class="val-display" id="field-val">Medio (Nivel 3)</span></label>
                <input type="range" id="field-slider" min="1" max="5" step="1" value="3">
            </div>

            <div class="control-group checkbox-group">
                <input type="checkbox" id="area-checkbox" checked>
                <label for="area-checkbox">Resaltar área de la bobina (visor de líneas magnéticas)</label>
            </div>

            <div class="btn-group">
                <button id="btn-play">Pausar / Continuar</button>
                <button id="btn-reset" class="btn-secondary">Reiniciar</button>
            </div>
        </div>

        <div id="view-3d-container">
            <div id="lines-counter">
                Líneas atravesando la bobina:<br>
                <span id="lines-val">0</span>
            </div>
        </div>
    </div>

    <div id="oscilloscope-container">
        <div id="oscilloscope-header">
            <span>Eje Vertical: Voltaje Inducido (V)</span>
            <span id="volt-display-container">Voltaje: <span id="volt-val">0.0</span> V</span>
            <span>Eje Horizontal: Tiempo</span>
        </div>
        <canvas id="osc-canvas"></canvas>
    </div>
</div>

<script>
    /** ESTADO GLOBAL **/
    let rpm = 0; 
    let turns = 2; 
    let coilScale = 1.0;
    let magneticField = 3; 
    let isPlaying = true;
    let coilAngle = 0;
    let showArea = true;
    let currentVoltage = 0;
    let totalFieldLines = 0; 
    
    const fieldLabels = ["Muy Débil (Nivel 1)", "Débil (Nivel 2)", "Medio (Nivel 3)", "Fuerte (Nivel 4)", "Muy Fuerte (Nivel 5)"];
    
    const oscHistory = [];
    const oscSpeed = 3; 
    let maxChartAmplitude = 70;
    let currentOscScale = 50; // Escala dinámica para el auto-ajuste del osciloscopio

    /** THREE.JS SETUP **/
    const container3D = document.getElementById('view-3d-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const aspect = container3D.clientWidth / container3D.clientHeight;
    const camera = new THREE.PerspectiveCamera(40, aspect, 0.1, 1000);
    camera.position.set(30, 20, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container3D.clientWidth, container3D.clientHeight);
    container3D.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(20, 30, 20);
    scene.add(dirLight);
    const pointLight = new THREE.PointLight(0xffeedd, 0.8);
    pointLight.position.set(-10, 5, 10);
    scene.add(pointLight);

    /** ELEMENTOS FIJOS **/
    const magnetGeo = new THREE.BoxGeometry(18, 1.5, 14);
    const northMat = new THREE.MeshLambertMaterial({ color: 0xcc0000 });
    const northMagnet = new THREE.Mesh(magnetGeo, northMat);
    northMagnet.position.y = 9;
    scene.add(northMagnet);

    const southMat = new THREE.MeshLambertMaterial({ color: 0x0033cc });
    const southMagnet = new THREE.Mesh(magnetGeo, southMat);
    southMagnet.position.y = -9;
    scene.add(southMagnet);

    const fieldLinesGroup = new THREE.Group();
    scene.add(fieldLinesGroup);

    function buildFieldLines() {
        while(fieldLinesGroup.children.length > 0) {
            fieldLinesGroup.remove(fieldLinesGroup.children[0]);
        }

        const dir = new THREE.Vector3(0, -1, 0);
        const length = 17;
        const hex = 0xff8c00; 

        const cols = magneticField + 2; 
        const rows = Math.ceil(magneticField / 2) + 1; 
        
        totalFieldLines = cols * rows; 

        const xSpan = 14;
        const zSpan = 10;
        
        const xStep = cols > 1 ? xSpan / (cols - 1) : 0;
        const zStep = rows > 1 ? zSpan / (rows - 1) : 0;

        const startX = -xSpan / 2;
        const startZ = -zSpan / 2;

        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                const x = startX + (i * xStep);
                const z = startZ + (j * zStep);
                const origin = new THREE.Vector3(x, 8.5, z);
                const arrow = new THREE.ArrowHelper(dir, origin, length, hex, 1.5, 0.8);
                fieldLinesGroup.add(arrow);
            }
        }
    }
    buildFieldLines();

    /** GRUPO DEL GENERADOR **/
    const generatorGroup = new THREE.Group();
    scene.add(generatorGroup);
    
    let coilGroup = new THREE.Group();
    generatorGroup.add(coilGroup);

    const copperMat = new THREE.MeshStandardMaterial({ 
        color: 0xe57845, roughness: 0.3, metalness: 0.9 
    });
    const axisMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.5 });
    const handleMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

    const baseWidth = 9;
    const baseLength = 9;
    const wireRadius = 0.15;

    let areaPlane;
    
    const particlesGroup = new THREE.Group();
    generatorGroup.add(particlesGroup);
    const particles = [];
    const numParticlesPerTurn = 16;
    const particleMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    const particleGeo = new THREE.SphereGeometry(0.22, 8, 8);
    
    function buildCoil() {
        while(coilGroup.children.length > 0) coilGroup.remove(coilGroup.children[0]);
        while(particlesGroup.children.length > 0) particlesGroup.remove(particlesGroup.children[0]);
        particles.length = 0;

        const width = baseWidth * coilScale;
        const length = baseLength * coilScale;
        
        const wireSpreadY = 0.35; 
        const startY = -(turns - 1) * wireSpreadY / 2;

        for(let i = 0; i < turns; i++) {
            const offsetY = startY + (i * wireSpreadY);
            const turnGroup = new THREE.Group();
            
            const sideLongGeo = new THREE.CylinderGeometry(wireRadius, wireRadius, width, 8);
            const sideShortGeo = new THREE.CylinderGeometry(wireRadius, wireRadius, length, 8);

            const side1 = new THREE.Mesh(sideLongGeo, copperMat);
            side1.position.z = length / 2;
            side1.rotation.z = Math.PI / 2;
            turnGroup.add(side1);

            const side2 = new THREE.Mesh(sideLongGeo, copperMat);
            side2.position.z = -length / 2;
            side2.rotation.z = Math.PI / 2;
            turnGroup.add(side2);

            const side3 = new THREE.Mesh(sideShortGeo, copperMat);
            side3.position.x = width / 2;
            side3.rotation.x = Math.PI / 2;
            turnGroup.add(side3);

            const side4 = new THREE.Mesh(sideShortGeo, copperMat);
            side4.position.x = -width / 2;
            side4.rotation.x = Math.PI / 2;
            turnGroup.add(side4);

            turnGroup.position.y = offsetY;
            coilGroup.add(turnGroup);

            for(let j = 0; j < numParticlesPerTurn; j++){
                const p = new THREE.Mesh(particleGeo, particleMat);
                particlesGroup.add(p);
                particles.push({ 
                    mesh: p, t: j / numParticlesPerTurn, offsetY: offsetY 
                });
            }
        }

        const leftAxis = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3), axisMat);
        leftAxis.rotation.z = Math.PI / 2;
        leftAxis.position.set(-width/2 - 1.5, 0, 0);
        coilGroup.add(leftAxis);

        const rightAxis = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3), axisMat);
        rightAxis.rotation.z = Math.PI / 2;
        rightAxis.position.set(width/2 + 1.5, 0, 0);
        coilGroup.add(rightAxis);

        const crankArmGeo = new THREE.BoxGeometry(0.6, 4, 0.6);
        const crankArm = new THREE.Mesh(crankArmGeo, axisMat);
        crankArm.position.set(width/2 + 3, 1.7, 0); 
        coilGroup.add(crankArm);

        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2.5), handleMat);
        handle.rotation.z = Math.PI / 2;
        handle.position.set(width/2 + 4.25, 3.4, 0);
        coilGroup.add(handle);

        const planeGeo = new THREE.PlaneGeometry(width, length);
        const planeMat = new THREE.MeshBasicMaterial({ 
            color: 0x00aaff, transparent: true, opacity: 0, 
            side: THREE.DoubleSide, depthWrite: false
        });
        areaPlane = new THREE.Mesh(planeGeo, planeMat);
        areaPlane.rotation.x = Math.PI / 2; 
        coilGroup.add(areaPlane);
    }
    buildCoil();

    /** LÓGICA DE CORRIENTE **/
    function updateParticlesPosition(deltaTime) {
        const width = baseWidth * coilScale;
        const length = baseLength * coilScale;
        const perimeter = (width * 2) + (length * 2);
        
        // Multiplicador visual equilibrado
        const currentSpeed = currentVoltage * 0.003; 
        
        particles.forEach(p => {
            p.t += (currentSpeed * deltaTime / 1000);
            
            if(p.t > 1) p.t -= 1;
            if(p.t < 0) p.t += 1;

            const pos = p.t * perimeter;
            
            if (pos < width) {
                p.mesh.position.set(-width/2 + pos, p.offsetY, -length/2);
            } else if (pos < width + length) {
                const offset = pos - width;
                p.mesh.position.set(width/2, p.offsetY, -length/2 + offset);
            } else if (pos < (width * 2) + length) {
                const offset = pos - (width + length);
                p.mesh.position.set(width/2 - offset, p.offsetY, length/2);
            } else {
                const offset = pos - ((width * 2) + length);
                p.mesh.position.set(-width/2, p.offsetY, length/2 - offset);
            }
        });
    }

    /** OSCILOSCOPIO **/
    const oscCanvas = document.getElementById('osc-canvas');
    const ctx = oscCanvas.getContext('2d');

    function resizeOscilloscope() {
        const container = document.getElementById('oscilloscope-container');
        oscCanvas.width = container.clientWidth;
        oscCanvas.height = container.clientHeight - 30; 
        maxChartAmplitude = (oscCanvas.height / 2) * 0.85;
    }
    resizeOscilloscope();

    function drawOscilloscope() {
        const width = oscCanvas.width;
        const height = oscCanvas.height;
        const centerY = height / 2;

        ctx.fillStyle = '#111111';
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let y = 0; y < height; y += 20) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
        for(let x = 0; x < width; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
        ctx.stroke();

        ctx.strokeStyle = '#666666';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, centerY);
        ctx.lineTo(width, centerY);
        ctx.stroke();

        if (oscHistory.length === 0) return;

        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';
        ctx.beginPath();

        const startX = width - (oscHistory.length * oscSpeed);
        
        for (let i = 0; i < oscHistory.length; i++) {
            const x = startX + (i * oscSpeed);
            
            // Auto-escalado dinámico: convertimos el voltaje absoluto a la escala visual actual
            const visualY = (oscHistory[i] / currentOscScale) * maxChartAmplitude;
            const clampedY = Math.max(Math.min(visualY, maxChartAmplitude), -maxChartAmplitude);
            
            const y = centerY - clampedY; 
            
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    /** CONTROLES E INTERACCIÓN **/
    document.getElementById('rpm-slider').addEventListener('input', (e) => {
        rpm = parseInt(e.target.value);
        document.getElementById('rpm-val').innerText = rpm;
    });

    document.getElementById('turns-slider').addEventListener('input', (e) => {
        turns = parseInt(e.target.value);
        document.getElementById('turns-val').innerText = turns;
        buildCoil();
    });

    document.getElementById('size-slider').addEventListener('input', (e) => {
        coilScale = parseInt(e.target.value) / 100;
        document.getElementById('size-val').innerText = e.target.value;
        buildCoil();
    });

    document.getElementById('field-slider').addEventListener('input', (e) => {
        magneticField = parseInt(e.target.value);
        document.getElementById('field-val').innerText = fieldLabels[magneticField - 1];
        buildFieldLines();
    });

    document.getElementById('area-checkbox').addEventListener('change', (e) => {
        showArea = e.target.checked;
        document.getElementById('lines-counter').style.display = showArea ? 'block' : 'none';
        if (!showArea && areaPlane) {
            areaPlane.material.opacity = 0;
        }
    });

    const btnPlay = document.getElementById('btn-play');
    btnPlay.addEventListener('click', () => {
        isPlaying = !isPlaying;
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
        rpm = 0;
        document.getElementById('rpm-slider').value = 0;
        document.getElementById('rpm-val').innerText = 0;
        
        coilAngle = 0;
        generatorGroup.rotation.x = 0;
        currentVoltage = 0;
        oscHistory.length = 0; 
        document.getElementById('volt-val').innerText = "0.0";
        if(showArea) document.getElementById('lines-val').innerText = "0";
        
        drawOscilloscope();
        updateParticlesPosition(0);
    });

    window.addEventListener('resize', () => {
        camera.aspect = container3D.clientWidth / container3D.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container3D.clientWidth, container3D.clientHeight);
        resizeOscilloscope();
    });

    /** ANIMACIÓN LOOP **/
    let lastTime = 0;

    function animate(time) {
        requestAnimationFrame(animate);
        const deltaTime = time - lastTime;
        lastTime = time;

        if (isPlaying) {
            const omega = (rpm * Math.PI * 2) / 60;
            const deltaAngle = omega * (deltaTime / 1000);
            coilAngle += deltaAngle;
            
            generatorGroup.rotation.x = coilAngle;

            const effectiveArea = Math.abs(Math.cos(coilAngle));
            
            // Cuando arranca la simulación (RPM 0), actualizar visual del área estática
            if (showArea && areaPlane) {
                areaPlane.material.opacity = 0.1 + (0.6 * effectiveArea);
                const capturedLines = Math.round(totalFieldLines * Math.min(coilScale, 1.3) * effectiveArea);
                document.getElementById('lines-val').innerText = capturedLines;
            }

            const areaFactor = coilScale * coilScale;
            
            // Cálculo de la amplitud máxima actual basada en los controles
            const voltageAmplitude = turns * rpm * areaFactor * magneticField * 0.1; 
            
            // Ajuste dinámico de la escala del osciloscopio (mínimo 20V para evitar salto abrupto al frenar)
            // Agregamos un 15% extra de margen visual superior
            currentOscScale = Math.max(20, voltageAmplitude * 1.15);

            currentVoltage = voltageAmplitude * Math.sin(coilAngle);
            
            document.getElementById('volt-val').innerText = currentVoltage.toFixed(1);
            
            oscHistory.push(currentVoltage);
            
            const maxPoints = Math.ceil(oscCanvas.width / oscSpeed);
            if (oscHistory.length > maxPoints) {
                oscHistory.shift();
            }

            updateParticlesPosition(deltaTime);
        }

        drawOscilloscope();
        renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
</script>
</body>
</html>
