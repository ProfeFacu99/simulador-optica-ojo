<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio CRT Profesional - Lorentz y Termoiónica</title>
    
    <style>
        body, button, input { 
            margin: 0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; background: #ffffff; color: #333; 
     #ui { 
    position: absolute; top: 15px; left: 15px; 
    background: rgba(255, 255, 255, 0.96); 
    padding: 15px; border-radius: 12px; 
    width: 300px; z-index: 100; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    border: 1px solid #e0e0e0;
    max-height: 90vh; /* Nunca supera la pantalla */
    overflow-y: auto;  /* Scroll interno si es necesario */
}
        h2 { margin: 0 0 15px 0; font-size: 1.2em; color: #1a1a1a; border-bottom: 2px solid #1976d2; padding-bottom: 8px; }
        .control { margin-bottom: 20px; }
        
        label { display: block; font-size: 0.85em; margin-bottom: 8px; font-weight: 700; color: #555; display: flex; align-items: center; }
        
        .info-icon {
            display: inline-block;
            width: 16px; height: 16px;
            background-color: #1976d2; color: #ffffff;
            border-radius: 50%;
            text-align: center;
            font-size: 11px; line-height: 16px;
            font-weight: bold;
            margin-left: 6px;
            cursor: help;
        }
        
        .val { margin-left: auto; color: #1565c0; font-weight: 700; font-size: 1.1em; }
        
        /* FIX DEFINITIVO DE SLIDERS PARA CROSS-BROWSER (LINUX/FIREFOX/CHROME) */
        input[type=range] { 
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 8px; 
            background: var(--track-bg, #e0e0e0); 
            border-radius: 4px;
            margin: 12px 0; outline: none;
            overflow: visible; /* FIX: sin esto, el thumb (18px) queda recortado por el overflow:hidden heredado de "body, button, input" */
        }
        
        /* Apagar pistas nativas para evitar recortes */
        input[type=range]::-webkit-slider-runnable-track { background: transparent; border: none; }
        input[type=range]::-moz-range-track { background: transparent; border: none; }
        input[type=range]::-moz-range-progress { background: transparent; border: none; }
        
        /* Tiradores (Thumbs) flotantes */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            height: 18px; width: 18px; border-radius: 50%;
            background: #1976d2; cursor: pointer; 
            border: 2px solid #fff; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            margin-top: -5px; /* Compensa la diferencia de altura con la barra */
            position: relative; z-index: 10;
        }
        input[type=range]::-moz-range-thumb {
            height: 18px; width: 18px; border-radius: 50%; 
            background: #1976d2; cursor: pointer; 
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            position: relative; z-index: 10;
        }
        
        .btn-action { 
            width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; 
            transition: all 0.3s; margin-top: 10px; border: none;
        }
        
        .btn-scan { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
        .btn-scan:hover { background: #bbdefb; }
        .btn-scan.active { background: #1565c0; color: #fff; }

        .btn-infinity { background: #f3e5f5; color: #6a1b9a; border: 1px solid #e1bee7; }
        .btn-infinity:hover { background: #e1bee7; }
        .btn-infinity.active { background: #6a1b9a; color: #fff; }
        
        .btn-reset { background: #fdf2f2; color: #e74c3c; border: 1px solid #ffcfcf; }
        .btn-reset:hover { background: #fee2e2; }

        #bottom-controls {
            position: absolute; bottom: 30px; left: 20px;
            display: flex; gap: 10px; z-index: 100;
        }
        .btn-small {
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;
            border: 1px solid #bbdefb; background: #e3f2fd; color: #1565c0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: all 0.3s;
            font-size: 0.85em;
        }
        .btn-small:hover { background: #bbdefb; }
        
        #speedometer {
            position: absolute; bottom: 30px; right: 30px;
            background: #111; color: #00ff00; 
            padding: 15px 25px; border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border: 2px solid #333;
            z-index: 100;
            text-align: center;
        }
        #speedometer .title { font-size: 0.75em; color: #888; margin-bottom: 5px; font-weight: bold; letter-spacing: 1px; }
        #speedometer .value { font-size: 1.6em; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,0,0.5); font-family: monospace; }

        #watermark {
            position: absolute; top: 25px; right: 25px;
            width: 24px; height: 24px;
            border: 1.5px solid rgba(128, 128, 128, 0.3);
            border-radius: 50%;
            color: rgba(128, 128, 128, 0.4);
            font-style: italic; font-weight: bold;
            font-size: 14px; line-height: 22px; text-align: center;
            cursor: help; z-index: 1000;
            transition: all 0.3s ease; user-select: none;
        }
        #watermark:hover {
            color: rgba(128, 128, 128, 0.9);
            border-color: rgba(128, 128, 128, 0.7);
        }
    </style>
</head>
<body>

    <div id="watermark" title="Facundo González - Física">i</div>

    <div id="ui">
        <h2>Laboratorio CRT</h2>
        
        <div class="control">
            <label>
                Temperatura Filamento
                <span class="info-icon" title="Regula la emisión termoiónica del cátodo. Al calentarse, el metal libera más electrones (aumenta la densidad de carga espacial).">i</span>
                <span id="valTemp" class="val">0 K</span>
            </label>
            <input type="range" id="sliderTemp" min="0" max="3000" step="50" value="0">
        </div>

        <div class="control">
            <label>
                Voltaje Acelerador (Va)
                <span class="info-icon" title="Crea el campo eléctrico longitudinal. Arrastra los electrones de la nube y les da energía cinética (velocidad) hacia la pantalla.">i</span>
                <span id="valVa" class="val">0 V</span>
            </label>
            <input type="range" id="sliderVa" min="0" max="5000" step="100" value="0">
        </div>

        <div class="control">
            <label>
                Campo Bx (Deflex. Vertical)
                <span class="info-icon" title="Bobinas horizontales. El campo magnético en X genera una Fuerza de Lorentz que desvía los electrones en el eje Y (arriba/abajo).">i</span>
                <span id="valBx" class="val">0,00 mT</span>
            </label>
            <input type="range" id="sliderBx" min="-100" max="100" value="0">
        </div>

        <div class="control">
            <label>
                Campo By (Deflex. Horizontal)
                <span class="info-icon" title="Bobinas verticales. El campo magnético en Y genera una Fuerza de Lorentz que desvía los electrones en el eje X (izquierda/derecha).">i</span>
                <span id="valBy" class="val">0,00 mT</span>
            </label>
            <input type="range" id="sliderBy" min="-100" max="100" value="0">
        </div>

        <button class="btn-action btn-scan" id="btnScan">SIMULAR BARRIDO CRT</button>
        <button class="btn-action btn-infinity" id="btnInfinity">SIMULAR SÍMBOLO INFINITO</button>
        <button class="btn-action btn-reset" onclick="resetSim()">REINICIAR SISTEMA</button>
    </div>

    <!-- Controles Inferiores -->
    <div id="bottom-controls">
        <button class="btn-small" id="btnTheme">FONDO: BLANCO</button>
        <button class="btn-small" id="btnToggleMagnets">OCULTAR IMANES</button>
    </div>

    <div id="speedometer">
        <div class="title">VELOCIDAD DEL HAZ (V)</div>
        <div class="value" id="speedText">0,00 &times; 10<sup>0</sup> m/s</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const Q_E = 1.602e-19; 
        const M_E = 9.109e-31; 
        const E_M = Q_E / M_E; 

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        camera.position.set(-35, 12, 20);
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const light1 = new THREE.PointLight(0xffffff, 200);
        light1.position.set(10, 20, 10);
        scene.add(light1);

        const Z_START = -12.5, Z_END = 12.5, R_BACK = 1.5, R_FRONT = 10;
        const Z_EMISSION = -14.0; 

        const tubeMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x88ccff, transparent: true, opacity: 0.1, 
            roughness: 0, thickness: 2, side: THREE.DoubleSide, depthWrite: false 
        });
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(R_BACK, R_FRONT, 25, 64, 1, true), tubeMat);
        tube.rotation.x = -Math.PI / 2; tube.renderOrder = 0;
        scene.add(tube);

        const gunGroup = new THREE.Group();
        const filMat = new THREE.MeshStandardMaterial({color: 0x333333, emissive: 0x000000, emissiveIntensity: 0});
        const filament = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5), filMat);
        filament.rotation.x = Math.PI/2; filament.position.z = -14.5;
        
        const ringMat1 = new THREE.MeshStandardMaterial({color: 0x444444, metalness: 0.9, emissive: 0x0044ff, emissiveIntensity: 0});
        const ringMat2 = new THREE.MeshStandardMaterial({color: 0x999999, metalness: 0.9, emissive: 0x0044ff, emissiveIntensity: 0});
        
        const buildRing = (z, r, mat) => {
            const ring = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.8), mat);
            ring.rotation.x = Math.PI/2; ring.position.z = z; return ring;
        };
        gunGroup.add(filament, buildRing(-13.5, 0.8, ringMat1), buildRing(-12, 1.2, ringMat2));
        scene.add(gunGroup);

        const screen = new THREE.Mesh(
            new THREE.CircleGeometry(R_FRONT, 32), 
            new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.9 })
        );
        screen.position.z = Z_END;
        scene.add(screen);

        const trailLength = 120; 
        const trailPositions = new Array(trailLength).fill(null);
        const trailMeshes = [];
        for(let i=0; i<trailLength; i++) {
            const opacity = Math.pow(1 - (i / trailLength), 1.5); 
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: opacity });
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), mat);
            mesh.visible = false;
            scene.add(mesh);
            trailMeshes.push(mesh);
        }

        const createCanvasTexture = (text) => {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white'; ctx.font = 'bold 90px Arial'; ctx.textAlign = 'center'; ctx.fillText(text, 64, 95);
            return new THREE.CanvasTexture(canvas);
        };
        const texN = createCanvasTexture('N'); const texS = createCanvasTexture('S');

        function createMagnet(x, y, z, plateRotZ, lx, ly, rx, ry) {
            const group = new THREE.Group();
            const plate = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.8, 4), new THREE.MeshStandardMaterial({color: 0x666666}));
            plate.rotation.z = plateRotZ; group.add(plate);
            
            const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), new THREE.MeshBasicMaterial({map: texN, transparent: true, side: THREE.DoubleSide}));
            labelMesh.position.set(lx, ly, 0); labelMesh.rotation.set(rx, ry, 0); labelMesh.visible = false;
            group.add(labelMesh); group.position.set(x, y, z); scene.add(group);
            return { group, plate, labelMesh };
        }

        const m1A = createMagnet(-5.5, 0, -8, Math.PI/2, -0.41, 0, 0, -Math.PI/2); 
        const m1B = createMagnet(5.5, 0, -8, Math.PI/2,  0.41, 0, 0, Math.PI/2);  
        const m2A = createMagnet(0, 5.5, -2, 0, 0,  0.41, -Math.PI/2, 0); 
        const m2B = createMagnet(0, -5.5, -2, 0, 0, -0.41,  Math.PI/2, 0); 

        const arrows1 = [], arrows2 = [];
        function initFieldLines(arr, zCenter, isVertical) {
            for(let i=0; i<9; i++) {
                const group = new THREE.Group();
                const mat = new THREE.MeshBasicMaterial({color: 0x00aaff, transparent: true, opacity: 0.3, depthWrite: false});
                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 9, 8), mat);
                const head = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 8), mat);
                shaft.renderOrder = 1; head.renderOrder = 1;

                if (isVertical) {
                    shaft.rotation.z = Math.PI / 2; head.rotation.z = -Math.PI / 2; 
                    group.position.set(0, ((i % 3) - 1) * 1.5, zCenter + (Math.floor(i / 3) - 1) * 1.5);
                } else {
                    group.position.set(((i % 3) - 1) * 1.5, 0, zCenter + (Math.floor(i / 3) - 1) * 1.5);
                }
                group.add(shaft); group.add(head); scene.add(group);
                arr.push({ group, shaft, head, mat });
            }
        }
        initFieldLines(arrows1, -8, true); initFieldLines(arrows2, -2, false);

        const MAX_PARTICLES = 300;
        const _forwardAxis = new THREE.Vector3(0, 0, 1);
        const _velDir = new THREE.Vector3();
        const particles = [];
        for(let i=0; i<MAX_PARTICLES; i++) {
            const p = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), new THREE.MeshBasicMaterial({color: 0x00ff00}));
            // delay aleatorio inicial para que no salgan apelotonados
            p.userData = { active: false, delay: Math.floor(Math.random() * 50) };
            scene.add(p); particles.push(p);
        }

        // --- GESTIÓN DE ESTADOS Y EVENTOS ---
        window.isScanning = false;
        window.isInfinity = false;
        window.showMagnets = true;
        
        document.getElementById('btnToggleMagnets').addEventListener('click', (e) => {
            window.showMagnets = !window.showMagnets;
            e.target.innerText = window.showMagnets ? "OCULTAR IMANES" : "MOSTRAR IMANES";
            updateVisuals(parseFloat(document.getElementById('sliderBx').value) / 50, parseFloat(document.getElementById('sliderBy').value) / 50);
        });

        const themes = [
            { hex: 0xffffff, label: 'FONDO: BLANCO' },
            { hex: 0x444444, label: 'FONDO: GRIS' },
            { hex: 0x050505, label: 'FONDO: OSCURO' }
        ];
        let currentTheme = 0;
        document.getElementById('btnTheme').addEventListener('click', (e) => {
            currentTheme = (currentTheme + 1) % themes.length;
            scene.background.setHex(themes[currentTheme].hex);
            e.target.innerText = themes[currentTheme].label;
        });
        
        document.getElementById('btnScan').addEventListener('click', (e) => {
            window.isScanning = !window.isScanning;
            if (window.isScanning) {
                window.isInfinity = false;
                document.getElementById('btnInfinity').innerText = "SIMULAR SÍMBOLO INFINITO";
                document.getElementById('btnInfinity').classList.remove('active');

                e.target.innerText = "DETENER BARRIDO";
                e.target.classList.add('active');
                document.getElementById('sliderTemp').value = 2800;
                document.getElementById('sliderVa').value = 4500;
            } else {
                e.target.innerText = "SIMULAR BARRIDO CRT";
                e.target.classList.remove('active');
                document.getElementById('sliderBx').value = 0;
                document.getElementById('sliderBy').value = 0;
            }
        });

        document.getElementById('btnInfinity').addEventListener('click', (e) => {
            window.isInfinity = !window.isInfinity;
            if (window.isInfinity) {
                window.isScanning = false;
                document.getElementById('btnScan').innerText = "SIMULAR BARRIDO CRT";
                document.getElementById('btnScan').classList.remove('active');

                e.target.innerText = "DETENER INFINITO";
                e.target.classList.add('active');
                document.getElementById('sliderTemp').value = 2800;
                document.getElementById('sliderVa').value = 4500;
            } else {
                e.target.innerText = "SIMULAR SÍMBOLO INFINITO";
                e.target.classList.remove('active');
                document.getElementById('sliderBx').value = 0;
                document.getElementById('sliderBy').value = 0;
            }
        });

        window.resetSim = () => {
            window.isScanning = false;
            window.isInfinity = false;
            
            document.getElementById('btnScan').innerText = "SIMULAR BARRIDO CRT";
            document.getElementById('btnScan').classList.remove('active');
            
            document.getElementById('btnInfinity').innerText = "SIMULAR SÍMBOLO INFINITO";
            document.getElementById('btnInfinity').classList.remove('active');
            
            document.getElementById('sliderBx').value = 0;
            document.getElementById('sliderBy').value = 0;
            document.getElementById('sliderVa').value = 0;
            document.getElementById('sliderTemp').value = 0;
            particles.forEach(p => p.userData.active = false); 
            trailPositions.fill(null); 
            window.lastHit = null;
        };

        function renderSliderBackgrounds() {
            ['sliderTemp', 'sliderVa'].forEach(id => {
                const el = document.getElementById(id);
                const percentage = (el.value - el.min) / (el.max - el.min) * 100;
                el.style.setProperty('--track-bg', `linear-gradient(to right, #1976d2 ${percentage}%, #e0e0e0 ${percentage}%)`);
            });
            
            ['sliderBx', 'sliderBy'].forEach(id => {
                const el = document.getElementById(id);
                const val = parseFloat(el.value);
                let start, end;
                if (val > 0) {
                    start = 50;
                    end = 50 + (val / 100) * 50;
                } else {
                    start = 50 - (Math.abs(val) / 100) * 50;
                    end = 50;
                }
                el.style.setProperty('--track-bg', `linear-gradient(to right, #e0e0e0 ${start}%, #1976d2 ${start}%, #1976d2 ${end}%, #e0e0e0 ${end}%)`);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const t = performance.now();
            const va = parseFloat(document.getElementById('sliderVa').value);
            
            let phaseShift = 0;
            if (va > 0) {
                const baseSpeed = 25 * Math.sqrt(va / 2000); 
                const distanceBetweenYokes = 6; 
                const timeDelayMs = (distanceBetweenYokes / baseSpeed) * 1000;
                const period = 2000; 
                phaseShift = (timeDelayMs / period) * Math.PI * 2;
            }
            
            if (window.isScanning) {
                const hPeriod = 150; 
                let hPhase = (t % hPeriod) / hPeriod; 
                const vPeriod = 2000; 
                let vPhase = (t % vPeriod) / vPeriod; 
                document.getElementById('sliderBy').value = -70 + (hPhase * 140);
                document.getElementById('sliderBx').value = 70 - (vPhase * 140);
            } else if (window.isInfinity) {
                const period = 2000; 
                const omega = (t % period) / period * Math.PI * 2;
                
                document.getElementById('sliderBy').value = 70 * Math.sin(omega);
                document.getElementById('sliderBx').value = 35 * Math.sin(2 * (omega + phaseShift));
            }

            renderSliderBackgrounds();

            const temp = parseFloat(document.getElementById('sliderTemp').value);
            const bx = parseFloat(document.getElementById('sliderBx').value) / 50;
            const by = parseFloat(document.getElementById('sliderBy').value) / 50;
            
            document.getElementById('valTemp').innerText = temp + ' K';
            document.getElementById('valVa').innerText = va + ' V';
            document.getElementById('valBx').innerText = ((bx*50)/100 * 2.5).toFixed(2).replace('.', ',') + ' mT';
            document.getElementById('valBy').innerText = ((by*50)/100 * 2.5).toFixed(2).replace('.', ',') + ' mT';

            let baseVisualSpeed = 0;
            if (va > 0) {
                const vReal = Math.sqrt(2 * E_M * va); 
                const exponent = Math.floor(Math.log10(vReal));
                const mantissa = (vReal / Math.pow(10, exponent)).toFixed(2).replace('.', ',');
                document.getElementById('speedText').innerHTML = `${mantissa} &times; 10<sup>${exponent}</sup> m/s`;
                baseVisualSpeed = 25 * Math.sqrt(va / 2000);
            } else {
                document.getElementById('speedText').innerHTML = `0,00 &times; 10<sup>0</sup> m/s`;
            }

            const tNorm = Math.max(0, (temp - 800) / 2200); 
            if (temp > 0) {
                const heatNorm = temp / 3000;
                filMat.emissiveIntensity = 1;
                filMat.emissive.setHSL(0.02 + (heatNorm * 0.13), 1, 0.05 + (heatNorm * 0.6));
            } else {
                filMat.emissiveIntensity = 0;
            }
            
            const activeParticles = Math.floor(tNorm * MAX_PARTICLES);
            const vaNorm = va / 5000;
            ringMat1.emissiveIntensity = vaNorm * 0.2;
            ringMat2.emissiveIntensity = vaNorm * 0.3;

            updateVisuals(bx, by);

            let hasHit = false, hitX = 0, hitY = 0;

            particles.forEach((p, i) => {
                // Control de Densidad Térmica
                if (i >= activeParticles) {
                    p.visible = false;
                    p.userData.active = false;
                    return;
                }

                // FIX 1: Delay de Emisión. 
                // Si la partícula chocó y se recicló, espera unos frames antes de reaparecer.
                // Esto distribuye el haz de forma continua sin tener que teletransportarlos atrás del cañón.
                if (p.userData.delay > 0 && va > 0) {
                    p.userData.delay--;
                    p.visible = false;
                    p.position.set(0, 0, Z_EMISSION);
                    return;
                }

                p.visible = true;

                if (!p.userData.active) {
                    p.position.set(
                        (Math.random() - 0.5) * 0.4, 
                        (Math.random() - 0.5) * 0.4, 
                        Z_EMISSION + Math.random() * 0.5
                    );
                    p.userData.vel = new THREE.Vector3(0, 0, 0);
                    p.userData.active = true;
                }

                let pos = p.position; 
                let vel = p.userData.vel;

                if (va === 0) {
                    // Movimiento Browniano (Nube térmica)
                    const jitter = 0.08 * tNorm;
                    pos.x += (Math.random() - 0.5) * jitter;
                    pos.y += (Math.random() - 0.5) * jitter;
                    pos.z += (Math.random() - 0.5) * jitter;
                    
                    // FIX 2: Clamping estricto para que los electrones NO viajen atrás del cátodo
                    if (pos.z < Z_EMISSION) pos.z = Z_EMISSION;
                    if (pos.z > -13.2) pos.z = -13.2;
                    
                    if (pos.x*pos.x + pos.y*pos.y > 0.4) {
                        pos.x *= 0.9; pos.y *= 0.9;
                    }
                    vel.set(0,0,0);
                    p.scale.set(1, 1, 1);
                } else {
                    // Disparo y Aceleración
                    vel.z = baseVisualSpeed;
                    
                    // Lente Electrostática (Enfoque del láser)
                    if (pos.z < Z_START) { 
                        pos.x *= 0.5; 
                        pos.y *= 0.5; 
                    }

                    // Campo Magnético de Lorentz
                    let B = new THREE.Vector3(0,0,0);
                    if (pos.z > -10 && pos.z < -6) B.x = bx;
                    if (pos.z > -4 && pos.z < 0) B.y = by;

                    if (B.length() > 0) {
                        let fuerzaCompensada = (pos.z > -4) ? -2.8 : -1.8;
                        let force = new THREE.Vector3().crossVectors(vel, B).multiplyScalar(fuerzaCompensada);
                        vel.add(force.multiplyScalar(0.016));
                    }
                    
                    pos.add(vel.clone().multiplyScalar(0.016));

                    // Colisión con la pantalla de cristal
                    let t_pos = (pos.z - Z_START) / 25;
                    let rLimit = R_BACK + t_pos * (R_FRONT - R_BACK);
                    let rActual = Math.sqrt(pos.x**2 + pos.y**2);

                    if (rActual > rLimit || pos.z >= Z_END) {
                        if (pos.z >= Z_END - 0.5 && rActual < rLimit) {
                            hasHit = true; hitX = pos.x; hitY = pos.y;
                        }
                        // Al chocar, vuelven al cátodo y entran en "delay" para separarse de sus compañeros
                        pos.set(0, 0, Z_EMISSION);
                        vel.set(0, 0, baseVisualSpeed);
                        p.userData.delay = Math.floor(Math.random() * 40); // Espera entre 0 y 40 frames
                    }

                    // Percepción visual de velocidad: el electrón se alarga como una pequeña estela
                    // orientada en la dirección real de su movimiento (curva con los campos magnéticos)
                    const speedMag = vel.length();
                    if (speedMag > 0.01) {
                        _velDir.copy(vel).normalize();
                        p.quaternion.setFromUnitVectors(_forwardAxis, _velDir);
                        const stretch = THREE.MathUtils.clamp(1 + speedMag / 12, 1, 2.8);
                        p.scale.set(1, 1, stretch);
                    }
                }
            });

            // Lógica de Persistencia de la Estela
            if (hasHit) {
                trailPositions.unshift({x: hitX, y: hitY});
                trailPositions.pop();
                window.lastHit = {x: hitX, y: hitY, time: performance.now()};
            } else if (va > 0 && temp > 800 && window.lastHit && (performance.now() - window.lastHit.time < 300)) {
                trailPositions.unshift({x: window.lastHit.x, y: window.lastHit.y});
                trailPositions.pop();
            } else {
                trailPositions.unshift(null);
                trailPositions.pop();
            }

            const hitScale = 0.5 + (tNorm * 0.5);
            for(let i=0; i<trailLength; i++) {
                if (trailPositions[i]) {
                    trailMeshes[i].position.set(trailPositions[i].x, trailPositions[i].y, Z_END - 0.1);
                    trailMeshes[i].scale.set(hitScale, hitScale, hitScale);
                    trailMeshes[i].visible = true;
                } else {
                    trailMeshes[i].visible = false;
                }
            }

            renderer.render(scene, camera);
        }

        function updateVisuals(bx, by) {
            const updateMag = (pA, pB, v) => {
                pA.group.visible = window.showMagnets;
                pB.group.visible = window.showMagnets;
                
                const active = Math.abs(v) > 0.02;
                pA.labelMesh.visible = active && window.showMagnets;
                pB.labelMesh.visible = active && window.showMagnets;
                
                if (active) {
                    pA.plate.material.color.set(v > 0 ? 0xff4444 : 0x4444ff);
                    pB.plate.material.color.set(v > 0 ? 0x4444ff : 0xff4444);
                    pA.labelMesh.material.map = v > 0 ? texN : texS;
                    pB.labelMesh.material.map = v > 0 ? texS : texN;
                } else {
                    pA.plate.material.color.set(0x666666);
                    pB.plate.material.color.set(0x666666);
                }
            };
            updateMag(m1A, m1B, bx); updateMag(m2A, m2B, by);

            arrows1.forEach(l => {
                const active = Math.abs(bx) > 0.02;
                l.group.visible = active; // Las flechas siempre se ven si hay campo
                if (active) {
                    const intensity = Math.abs(bx) / 2; const thickness = 1 + intensity * 2.5;
                    l.shaft.scale.set(thickness, 1, thickness); l.head.scale.set(thickness, 1, thickness);
                    l.mat.opacity = 0.2 + intensity * 0.7; l.head.rotation.z = bx > 0 ? -Math.PI / 2 : Math.PI / 2;
                }
            });

            arrows2.forEach(l => {
                const active = Math.abs(by) > 0.02;
                l.group.visible = active; // Las flechas siempre se ven si hay campo
                if (active) {
                    const intensity = Math.abs(by) / 2; const thickness = 1 + intensity * 2.5;
                    l.shaft.scale.set(thickness, 1, thickness); l.head.scale.set(thickness, 1, thickness);
                    l.mat.opacity = 0.2 + intensity * 0.7; l.head.rotation.z = by > 0 ? Math.PI : 0;
                }
            });
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
