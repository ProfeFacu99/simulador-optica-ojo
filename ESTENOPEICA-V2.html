<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Simulador de cámara estenopeica con rayos alineados a los extremos reales de la planta y la imagen frontal recortada al círculo de la pantalla.</h2>

<svg id="scene" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;">
  <title>Esquema de la cámara estenopeica</title>
  <defs>
    <g id="planta">
      <path d="M-11,6 L11,6 L8,26 L-8,26 Z" fill="#8B4A2B"/>
      <rect x="-13" y="2" width="26" height="6" rx="1" fill="#6E3A20"/>
      <path d="M0,4 C-2,-10 -4,-20 -1,-30 C2,-20 2,-8 0,4" fill="#2E8B3D"/>
      <path d="M-2,4 C-10,-4 -16,-12 -17,-24 C-9,-18 -4,-8 -2,4" fill="#3BA84C"/>
      <path d="M2,4 C10,-4 16,-12 17,-24 C9,-18 4,-8 2,4" fill="#3BA84C"/>
      <path d="M-3,4 C-14,0 -20,-4 -25,-12 C-15,-10 -7,-4 -3,4" fill="#2E8B3D"/>
      <path d="M3,4 C14,0 20,-4 25,-12 C15,-10 7,-4 3,4" fill="#2E8B3D"/>
    </g>
    <clipPath id="screenClip">
      <ellipse cx="90" cy="150" rx="12.8" ry="49.3"/>
    </clipPath>
  </defs>
  <text x="80" y="26" class="t" style="font-size:13px;" text-anchor="middle">Pantalla (papel calco)</text>
  <text x="80" y="280" class="t" style="font-size:13px;" text-anchor="middle">Imagen invertida</text>

  <g id="eye" transform="translate(24,150)">
    <path d="M-16,0 C-8,-9 8,-9 16,0 C8,9 -8,9 -16,0 Z" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4.5" fill="#3BB3D0"/>
    <circle cx="0" cy="0" r="2" fill="#2C2C2A"/>
  </g>

  <g id="tube"></g>
  <g id="rays"></g>
  <g id="obj"></g>
  <g id="labels"></g>
</svg>

<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:1rem;align-items:stretch;">
  <div style="display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0;">
    <div style="display:flex;align-items:center;gap:10px;">
      <label style="font-size:12px;color:#378ADD;font-weight:500;min-width:120px;line-height:1.3;">Distancia pantalla – estenopo</label>
      <input type="range" id="dScreen" min="5" max="40" step="0.5" value="20" style="flex:1;min-width:0;">
      <input type="number" id="dScreenTxt" min="5" max="40" step="0.5" value="20" style="width:62px;color:#378ADD;font-weight:500;">
      <span style="font-size:11px;color:#378ADD;">cm</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <label style="font-size:12px;color:#D4537E;font-weight:500;min-width:120px;line-height:1.3;">Tamaño del estenopo</label>
      <input type="range" id="pin" min="0.2" max="5" step="0.1" value="0.8" style="flex:1;min-width:0;">
      <input type="number" id="pinTxt" min="0.2" max="5" step="0.1" value="0.8" style="width:62px;color:#D4537E;font-weight:500;">
      <span style="font-size:11px;color:#D4537E;">mm</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <label style="font-size:12px;color:var(--text-primary);font-weight:500;min-width:120px;line-height:1.3;">Distancia del objeto</label>
      <input type="range" id="dObj" min="60" max="300" step="5" value="120" style="flex:1;min-width:0;">
      <input type="number" id="dObjTxt" min="60" max="300" step="5" value="120" style="width:62px;font-weight:500;">
      <span style="font-size:11px;color:var(--text-secondary);">cm</span>
    </div>
    <p id="minNote" style="font-size:11px;color:var(--text-muted);margin:0 0 0 130px;"></p>
  </div>

  <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:0.75rem;min-width:0;">
    <p style="font-size:12px;color:var(--text-secondary);margin:0 0 6px;">Imagen en la pantalla</p>
    <div style="background:#111;border-radius:8px;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <svg id="perceived" viewBox="-60 -60 120 120" style="height:100%;width:100%;">
        <defs>
          <clipPath id="frontClip"><circle cx="0" cy="0" r="52"/></clipPath>
        </defs>
        <circle cx="0" cy="0" r="52" fill="#F4F2EA" opacity="0.12"/>
        <g clip-path="url(#frontClip)">
          <g id="pimg" transform="rotate(180)">
            <g transform="translate(0,-2)">
              <path d="M-11,6 L11,6 L8,26 L-8,26 Z" fill="#8B4A2B"/>
              <rect x="-13" y="2" width="26" height="6" rx="1" fill="#6E3A20"/>
              <path d="M0,4 C-2,-10 -4,-20 -1,-30 C2,-20 2,-8 0,4" fill="#2E8B3D"/>
              <path d="M-2,4 C-10,-4 -16,-12 -17,-24 C-9,-18 -4,-8 -2,4" fill="#3BA84C"/>
              <path d="M2,4 C10,-4 16,-12 17,-24 C9,-18 4,-8 2,4" fill="#3BA84C"/>
              <path d="M-3,4 C-14,0 -20,-4 -25,-12 C-15,-10 -7,-4 -3,4" fill="#2E8B3D"/>
              <path d="M3,4 C14,0 20,-4 25,-12 C15,-10 7,-4 3,4" fill="#2E8B3D"/>
            </g>
          </g>
        </g>
        <circle cx="0" cy="0" r="52" fill="none" stroke="#F4F2EA" stroke-width="1" opacity="0.25"/>
      </svg>
    </div>
  </div>
</div>

<script>
(function(){
  var dScreen = document.getElementById('dScreen'),
      pin = document.getElementById('pin'),
      dObj = document.getElementById('dObj'),
      dScreenTxt = document.getElementById('dScreenTxt'),
      pinTxt = document.getElementById('pinTxt'),
      dObjTxt = document.getElementById('dObjTxt'),
      minNote = document.getElementById('minNote');

  var tube = document.getElementById('tube'),
      rays = document.getElementById('rays'),
      objG = document.getElementById('obj'),
      labels = document.getElementById('labels'),
      pimg = document.getElementById('pimg');

  var NS = 'http://www.w3.org/2000/svg';
  function el(name, attrs){
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  var CY = 150;
  var SCREEN_X = 90;
  var R = 58, rx = 16;
  var MAX_IMG = R * 0.78;
  var PERSP = 0.32;
  var OBJ_SCALE = 1.3;
  var OBJ_CY = CY - 8;
  var TOP_EXT = 30 * OBJ_SCALE + 8;
  var BOT_EXT = 26 * OBJ_SCALE - 8;

  function minObjFor(ds){
    var pinX = SCREEN_X + 50 + ds * 4;
    var minGapPx = TOP_EXT * (pinX - SCREEN_X) / MAX_IMG;
    var minD = Math.ceil((minGapPx / 1.1) / 5) * 5;
    return Math.max(60, minD);
  }

  function render(){
    var ds = parseFloat(dScreen.value);
    var p  = parseFloat(pin.value);

    var minD = minObjFor(ds);
    dObj.min = minD;
    dObjTxt.min = minD;
    if (parseFloat(dObj.value) < minD){
      dObj.value = minD;
      dObjTxt.value = minD;
    }
    var doj = parseFloat(dObj.value);
    minNote.textContent = 'Distancia mínima del objeto: ' + minD + ' cm';

    var pinX = SCREEN_X + 50 + ds * 4;
    var objX = Math.min(645, pinX + doj * 1.1);
    var k = (pinX - SCREEN_X) / (objX - pinX);

    tube.innerHTML = ''; rays.innerHTML = ''; objG.innerHTML = ''; labels.innerHTML = '';

    tube.appendChild(el('rect', {x: SCREEN_X - 40, y: CY - R, width: (pinX - SCREEN_X + 40), height: R*2, fill: '#B4B2A9'}));
    tube.appendChild(el('ellipse', {cx: SCREEN_X - 40, cy: CY, rx: rx, ry: R, fill: '#9A988F'}));
    tube.appendChild(el('ellipse', {cx: SCREEN_X - 40, cy: CY, rx: rx*0.45, ry: R*0.42, fill: '#E8E6DE'}));
    tube.appendChild(el('ellipse', {cx: pinX, cy: CY, rx: rx, ry: R, fill: '#DDDBD3', stroke: '#888780', 'stroke-width': 1}));
    tube.appendChild(el('ellipse', {cx: SCREEN_X, cy: CY, rx: rx*0.8, ry: R*0.85, fill: '#F4F2EA', stroke: '#888780', 'stroke-width': 1}));

    var pinR = 1.5 + p * 2.2;
    tube.appendChild(el('ellipse', {cx: pinX, cy: CY, rx: pinR*0.45, ry: pinR, fill: '#D4537E', stroke: '#2C2C2A', 'stroke-width': 0.8}));

    var objTopY = CY - TOP_EXT;
    var objBotY = CY + BOT_EXT;
    var scrTopY = CY + TOP_EXT * k;
    var scrBotY = CY - BOT_EXT * k;

    rays.appendChild(el('line', {x1: objX, y1: objTopY, x2: SCREEN_X, y2: scrTopY, stroke: '#5F5E5A', 'stroke-width': 0.8}));
    rays.appendChild(el('line', {x1: objX, y1: objBotY, x2: SCREEN_X, y2: scrBotY, stroke: '#5F5E5A', 'stroke-width': 0.8}));
    rays.appendChild(el('circle', {cx: objX, cy: objTopY, r: 2, fill: '#2C2C2A'}));
    rays.appendChild(el('circle', {cx: objX, cy: objBotY, r: 2, fill: '#2C2C2A'}));

    var blurMm = p * (1 + ds/doj);
    var blurPx = Math.max(0, (blurMm - 0.35) * 2.2);
    var area = Math.PI * (p/2) * (p/2);
    var bright = area / (ds*ds) * 900;
    var brightCss = Math.max(0.18, Math.min(1.6, 0.25 + bright));

    var s = OBJ_SCALE * k;
    var ty = CY + 8 * k;
    var gClip = el('g', {'clip-path': 'url(#screenClip)'});
    var gImg = el('g', {transform: 'translate(' + SCREEN_X + ',' + ty.toFixed(2) + ') rotate(180) scale(' + (s*PERSP).toFixed(3) + ' ' + s.toFixed(3) + ')'});
    gImg.style.filter = 'blur(' + (blurPx*0.35).toFixed(2) + 'px) brightness(' + brightCss.toFixed(2) + ')';
    gImg.style.opacity = Math.max(0.35, Math.min(1, 0.4 + bright)).toFixed(2);
    gImg.appendChild(el('use', {href: '#planta'}));
    gClip.appendChild(gImg);
    tube.appendChild(gClip);

    objG.appendChild(el('use', {href: '#planta', transform: 'translate(' + objX + ',' + OBJ_CY + ') scale(' + OBJ_SCALE + ')'}));

    function arrow(x1, x2, y, color){
      labels.appendChild(el('line', {x1: x1+6, y1: y, x2: x2-6, y2: y, stroke: color, 'stroke-width': 1.5}));
      labels.appendChild(el('path', {d: 'M'+(x1+7)+','+y+' l6,-4 v8 z', fill: color}));
      labels.appendChild(el('path', {d: 'M'+(x2-7)+','+y+' l-6,-4 v8 z', fill: color}));
    }

    arrow(SCREEN_X, pinX, CY + R + 18, '#378ADD');
    var t1 = el('text', {x: (SCREEN_X+pinX)/2, y: CY + R + 36, 'text-anchor': 'middle', fill: '#378ADD', style: 'font-size:12px;font-style:italic;font-weight:500;'});
    t1.textContent = 'Pantalla – estenopo: ' + ds.toFixed(1) + ' cm';
    labels.appendChild(t1);

    var t2 = el('text', {x: pinX - 10, y: CY - R - 14, 'text-anchor': 'end', 'class': 't', style: 'font-size:12px;'});
    t2.textContent = 'Estenopo';
    labels.appendChild(t2);
    labels.appendChild(el('path', {d: 'M'+(pinX-8)+','+(CY-R-10)+' Q'+(pinX+2)+','+(CY-R-2)+' '+pinX+','+(CY-14), fill: 'none', stroke: '#888780', 'stroke-width': 1}));

    var t3 = el('text', {x: pinX + 12, y: CY + 4, fill: '#D4537E', style: 'font-size:12px;font-weight:500;'});
    t3.textContent = p.toFixed(1) + ' mm';
    labels.appendChild(t3);

    arrow(pinX, objX, CY + R + 18, '#888780');
    var t4 = el('text', {x: (pinX+objX)/2, y: CY + R + 36, 'text-anchor': 'middle', 'class': 't', style: 'font-size:12px;font-weight:500;'});
    t4.textContent = 'Distancia objeto: ' + doj.toFixed(0) + ' cm';
    labels.appendChild(t4);

    var t5 = el('text', {x: objX, y: objTopY - 14, 'text-anchor': 'middle', 'class': 't', style: 'font-size:13px;'});
    t5.textContent = 'Objeto real';
    labels.appendChild(t5);

    var m = ds / doj;
    var scale = Math.max(0.25, Math.min(1.55, m * 12));
    pimg.setAttribute('transform', 'rotate(180) scale(' + scale.toFixed(3) + ')');
    pimg.style.filter = 'blur(' + blurPx.toFixed(2) + 'px) brightness(' + brightCss.toFixed(2) + ')';
  }

  function link(slider, txt){
    slider.addEventListener('input', function(){ txt.value = slider.value; render(); });
    txt.addEventListener('input', function(){
      var v = parseFloat(txt.value);
      if (!isNaN(v)) { slider.value = Math.min(parseFloat(slider.max), Math.max(parseFloat(slider.min), v)); render(); }
    });
  }
  link(dScreen, dScreenTxt);
  link(pin, pinTxt);
  link(dObj, dObjTxt);
  render();
})();
</script>
